def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility

tasks.register("testWireGuardGo", Exec) {
    description = "Runs host-side Go tests for the internal WireGuard bridge."
    group = "verification"
    workingDir file("jni/tg_wg/go")
    def goTestBuildDir = rootProject.file(".gradle/wireguard-go-test")
    environment "GOCACHE", file("${goTestBuildDir}/gocache")
    environment "GOMODCACHE", file("${goTestBuildDir}/gomod")
    doFirst {
        file("${goTestBuildDir}/gocache").mkdirs()
        file("${goTestBuildDir}/gomod").mkdirs()
    }
    commandLine "go", "test", "-count=1", "./..."
}

tasks.register("testAmneziaWGGo", Exec) {
    description = "Runs host-side Go tests for the internal AmneziaWG bridge."
    group = "verification"
    workingDir file("jni/tg_awg/go")
    def goTestBuildDir = rootProject.file(".gradle/amneziawg-go-test")
    environment "GOCACHE", file("${goTestBuildDir}/gocache")
    environment "GOMODCACHE", file("${goTestBuildDir}/gomod")
    doFirst {
        file("${goTestBuildDir}/gocache").mkdirs()
        file("${goTestBuildDir}/gomod").mkdirs()
    }
    commandLine "go", "test", "-count=1", "./..."
}

tasks.register("verifyWireGuardStaticGuards") {
    description = "Checks static fail-closed and no-device-VPN invariants for tunnel integration."
    group = "verification"
    doLast {
        def checkedFiles = fileTree(projectDir) {
            include "src/main/java/org/telegram/messenger/WireGuard*.java"
            include "src/main/java/org/telegram/messenger/Tunnel*.java"
            include "jni/tg_wg/**"
            include "jni/tg_awg/**"
            exclude "jni/tg_wg/go/go.sum"
            exclude "jni/tg_wg/go/go.mod"
            exclude "jni/tg_awg/go/go.sum"
            exclude "jni/tg_awg/go/go.mod"
        }
        checkedFiles.each { source ->
            def text = source.text
            ["VpnService", "Builder.establish", "/dev/tun"].each { forbidden ->
                if (text.contains(forbidden)) {
                    throw new GradleException("Forbidden WireGuard integration token '${forbidden}' found in ${source}")
                }
            }
        }
        if (file("jni/tg_wg/go/build").exists()) {
            throw new GradleException("TMessagesProj/jni/tg_wg/go/build must not exist; Go caches under jni are packaged as native libs")
        }
        if (file("jni/tg_awg/go/build").exists()) {
            throw new GradleException("TMessagesProj/jni/tg_awg/go/build must not exist; Go caches under jni are packaged as native libs")
        }
        def wireGuardSecureStoreText = file("src/main/java/org/telegram/messenger/WireGuardSecureStore.java").text
        ["AndroidKeyStore", "AES/GCM/NoPadding", "Build.VERSION_CODES.M", "wireguard_profiles_encrypted_v1", "PROFILE_SCHEMA_V2", "TunnelProtocol.fromStorageValue"].each { token ->
            if (!wireGuardSecureStoreText.contains(token)) {
                throw new GradleException("Tunnel profiles must use Android Keystore-backed encrypted storage token '${token}'")
            }
        }
        def wireGuardSettingsText = file("src/main/java/org/telegram/messenger/WireGuardSettings.java").text
        ["WireGuardSecureStore.loadProfiles", "WireGuardSecureStore.saveProfiles", "saveSettingsLocked", "tunnel_enabled", "wireguard_enabled"].each { token ->
            if (!wireGuardSettingsText.contains(token)) {
                throw new GradleException("WireGuardSettings must keep tunnel profile storage encrypted and settings disable-able token '${token}'")
            }
        }
        def wireGuardManagerText = file("src/main/java/org/telegram/messenger/WireGuardManager.java").text
        ["WireGuardSettings.isSecureStorageSupported"].each { token ->
            if (!wireGuardManagerText.contains(token)) {
                throw new GradleException("WireGuardManager.isSupported must gate secure storage support token '${token}'")
            }
        }
        def tunnelManagerText = file("src/main/java/org/telegram/messenger/TunnelManager.java").text
        ["nativeWireGuardStart", "nativeAmneziaWGStart", "nativeAmneziaWGOnNetworkChanged", "nativeAmneziaWGStop", "missing active tunnel profile"].each { token ->
            if (!tunnelManagerText.contains(token)) {
                throw new GradleException("TunnelManager must select and fail-close active tunnel runtimes token '${token}'")
            }
        }
        fileTree("src/main/java/org/telegram/messenger") {
            include "WireGuard*.java"
            include "Tunnel*.java"
        }.each { source ->
            if (source.text.contains("wireguard_profile_list")) {
                throw new GradleException("Tunnel profiles must not be stored in plaintext mainconfig in ${source}")
            }
        }
        def connectionsManagerText = file("src/main/java/org/telegram/tgnet/ConnectionsManager.java").text
        if (!connectionsManagerText.contains("TunnelManager.applyProxySettingsForAccount")) {
            throw new GradleException("ConnectionsManager.setProxySettings must preserve tunnel proxy settings when a tunnel is enabled")
        }
        def networkRouteSettingsText = file("src/main/java/org/telegram/messenger/NetworkRouteSettings.java").text
        ["TunnelManager.enable", "TunnelManager.disable", "proxy_enabled", "ConnectionsManager.setProxySettings"].each { token ->
            if (!networkRouteSettingsText.contains(token)) {
                throw new GradleException("NetworkRouteSettings must enforce proxy/tunnel mutual exclusion token '${token}'")
            }
        }
        ["public static boolean enableTunnel", "TunnelManager.isSupported", "return false", "proxy_enabled_calls", "proxyRotationEnabled"].each { token ->
            if (!networkRouteSettingsText.contains(token)) {
                throw new GradleException("NetworkRouteSettings must guard tunnel support and disable proxy state token '${token}'")
            }
        }
        if (!(networkRouteSettingsText =~ /disableTunnel\(\)[\s\S]*putBoolean\("proxy_enabled", false\)[\s\S]*putBoolean\("proxy_enabled_calls", false\)/)) {
            throw new GradleException("NetworkRouteSettings.disableTunnel must leave ordinary proxy and proxy-for-calls disabled")
        }
        def proxyListActivityText = file("src/main/java/org/telegram/ui/ProxyListActivity.java").text
        ["TunnelManager.isSupported", "TunnelUnsupportedOnThisDevice", "showWireGuardUnsupported", "!useWireGuardSettings &&", "showAddTunnelProtocolDialog"].each { token ->
            if (!proxyListActivityText.contains(token)) {
                throw new GradleException("ProxyListActivity must gate tunnel support and hide proxy-calls UI in tunnel mode token '${token}'")
            }
        }
        def wireGuardSettingsActivityText = file("src/main/java/org/telegram/ui/WireGuardSettingsActivity.java").text
        ["TunnelManager.isSupported", "TunnelUnsupportedOnThisDevice", "showWireGuardUnsupported", "TunnelProtocol.AMNEZIA_WG", "AmneziaWGJc"].each { token ->
            if (!wireGuardSettingsActivityText.contains(token)) {
                throw new GradleException("WireGuardSettingsActivity must gate new tunnel profiles when secure storage is unavailable token '${token}'")
            }
        }
        [
                "src/main/java/org/telegram/ui/ProxyListActivity.java",
                "src/main/java/org/telegram/ui/ProxySettingsActivity.java",
                "src/main/java/org/telegram/messenger/AndroidUtilities.java",
                "src/main/java/org/telegram/messenger/ProxyRotationController.java"
        ].each { path ->
            def text = file(path).text
            if (!text.contains("NetworkRouteSettings")) {
                throw new GradleException("${path} must use NetworkRouteSettings for route changes")
            }
        }
        ["src/main/java/org/telegram/ui/LoginActivity.java", "src/main/java/org/telegram/ui/DialogsActivity.java"].each { path ->
            def text = file(path).text
            if (!text.contains("TunnelManager.isUserEnabled")) {
                throw new GradleException("${path} must include tunnel route status")
            }
        }
        def loginActivityText = file("src/main/java/org/telegram/ui/LoginActivity.java").text
        if (!loginActivityText.contains("showProxyButton(true, animated);")) {
            throw new GradleException("LoginActivity must keep the proxy/WireGuard settings entry visible before authorization")
        }
        def wireGuardParserText = file("src/main/java/org/telegram/messenger/WireGuardConfigParser.java").text
        if (!wireGuardParserText.contains("peerSections != 1")) {
            throw new GradleException("WireGuardConfigParser must reject multiple peers for this UI stage")
        }
        ["jc", "h1", "i1", "TunnelProtocol.AMNEZIA_WG"].each { token ->
            if (!wireGuardParserText.contains(token)) {
                throw new GradleException("WireGuardConfigParser must parse AmneziaWG configs token '${token}'")
            }
        }
        def voipServiceText = file("src/main/java/org/telegram/messenger/voip/VoIPService.java").text
        ["TunnelManager.getProxySettings", "TunnelVoipRouting.shouldEnableP2p", "TunnelVoipRouting.selectEndpointType", "PROTOCOL_HTTP_CONNECT"].each { token ->
            if (!voipServiceText.contains(token)) {
                throw new GradleException("VoIPService must route calls through tunnel token '${token}'")
            }
        }
        def nativeInstanceText = file("src/main/java/org/telegram/messenger/voip/NativeInstance.java").text
        if (!nativeInstanceText.contains("Instance.Proxy proxy")) {
            throw new GradleException("NativeInstance.makeGroup must accept a proxy for WireGuard group-call routing")
        }
        def livePlayerText = file("src/main/java/org/telegram/ui/Stories/LivePlayer.java").text
        ["TunnelManager.getProxySettings", "PROTOCOL_HTTP_CONNECT"].each { token ->
            if (!livePlayerText.contains(token)) {
                throw new GradleException("LivePlayer group-call streaming must route through tunnel token '${token}'")
            }
        }
        def groupNetworkManagerText = file("jni/voip/tgcalls/group/GroupNetworkManager.cpp").text
        ["set_proxy", "PROXY_HTTPS", "PORTALLOCATOR_DISABLE_UDP", "PORTALLOCATOR_DISABLE_STUN", "CF_REFLEXIVE", "CF_HOST"].each { token ->
            if (!groupNetworkManagerText.contains(token)) {
                throw new GradleException("GroupNetworkManager must enforce WireGuard proxy routing token '${token}'")
            }
        }
        def networkManagerText = file("jni/voip/tgcalls/NetworkManager.cpp").text
        ["set_proxy", "PROXY_HTTPS", "PORTALLOCATOR_DISABLE_UDP", "PORTALLOCATOR_DISABLE_STUN", "CF_REFLEXIVE", "CF_HOST"].each { token ->
            if (!networkManagerText.contains(token)) {
                throw new GradleException("NetworkManager must enforce WireGuard private-call proxy routing token '${token}'")
            }
        }
        def nativeNetworkingV2Text = file("jni/voip/tgcalls/v2/NativeNetworkingImpl.cpp").text
        ["set_proxy", "PROXY_HTTPS", "PORTALLOCATOR_DISABLE_UDP", "PORTALLOCATOR_DISABLE_STUN", "CF_REFLEXIVE", "CF_HOST", "!_enableTCP && !_proxy"].each { token ->
            if (!nativeNetworkingV2Text.contains(token)) {
                throw new GradleException("NativeNetworkingImpl must enforce WireGuard private-call V2 proxy routing token '${token}'")
            }
        }
        def instanceV2ReferenceText = file("jni/voip/tgcalls/v2/InstanceV2ReferenceImpl.cpp").text
        ["set_proxy", "PROXY_HTTPS", "PORTALLOCATOR_DISABLE_UDP", "PORTALLOCATOR_DISABLE_STUN", "CF_REFLEXIVE", "CF_HOST", "kTcpCandidatePolicyEnabled", "server.isTcp && !_proxy", "?transport=tcp"].each { token ->
            if (!instanceV2ReferenceText.contains(token)) {
                throw new GradleException("InstanceV2ReferenceImpl must enforce WireGuard private-call V2 reference proxy routing token '${token}'")
            }
        }
        def wireGuardGoText = file("jni/tg_wg/go/tg_wg.go").text
        if (!wireGuardGoText.contains("httpConnectHandshake")) {
            throw new GradleException("WireGuard Go proxy must support HTTP CONNECT for WebRTC TCP routing")
        }
        def amneziaWGGoText = file("jni/tg_awg/go/tg_wg.go").text
        ["github.com/amnezia-vpn/amneziawg-go", "httpConnectHandshake"].each { token ->
            if (!amneziaWGGoText.contains(token)) {
                throw new GradleException("AmneziaWG Go proxy must use the pinned bridge and support HTTP CONNECT token '${token}'")
            }
        }
        def amneziaWGModText = file("jni/tg_awg/go/go.mod").text
        ["github.com/amnezia-vpn/amneziawg-go v0.2.18", "go 1.24.4"].each { token ->
            if (!amneziaWGModText.contains(token)) {
                throw new GradleException("AmneziaWG Go module must stay pinned token '${token}'")
            }
        }
    }
}

tasks.register("verifyTunnelStaticGuards") {
    description = "Alias for tunnel static guards."
