// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
    }
}
repositories {
    google()
}

tasks.register("verifyTunnelCommandContract") {
    description = "Checks that the documented tunnel commands and Gradle entry points stay aligned."
    group = "verification"
    doLast {
        def agentsText = rootProject.file("AGENTS.md").text
        def testingDocsText = rootProject.file("docs/tunnel-testing.md").text
        def integrationDocsText = rootProject.file("docs/tunnel-integration.md").text
        def rootBuildText = rootProject.file("build.gradle").text
        def appBuildText = rootProject.file("TMessagesProj_App/build.gradle").text

        [
                "tasks.register(\"tunnelCheck\")",
                "tasks.register(\"tunnelPackageDebug\")",
                "dependsOn \":TMessagesProj:testDebugUnitTest\"",
                "dependsOn \":TMessagesProj:testTunnelGo\"",
                "dependsOn \":TMessagesProj:verifyTunnelStaticGuards\"",
                "dependsOn \":TMessagesProj_App:assembleAfatDebug\""
        ].each { token ->
            if (!rootBuildText.contains(token)) {
                throw new GradleException("Canonical tunnel command entry points are missing token '${token}'")
            }
        }

        [
                "./gradlew --no-daemon tunnelCheck",
                "./gradlew --no-daemon tunnelPackageDebug"
        ].each { command ->
            if (!agentsText.contains(command)) {
                throw new GradleException("AGENTS.md is missing canonical tunnel command '${command}'")
            }
            if (!testingDocsText.contains(command)) {
                throw new GradleException("docs/tunnel-testing.md is missing canonical tunnel command '${command}'")
            }
        }

        if (!integrationDocsText.contains("tunnelPackageDebug")) {
            throw new GradleException("docs/tunnel-integration.md must refer to tunnelPackageDebug")
        }
        if (!appBuildText.contains('dependsOn ":tunnelCheck"')) {
            throw new GradleException("assembleAfatDebug must depend on the canonical tunnelCheck task")
        }

        def tunnelNativeTargets = "targets 'tmessages.49', 'tg-wg', 'tg-awg'"
        [
                "TMessagesProj/build.gradle",
                "TMessagesProj_App/build.gradle",
                "TMessagesProj_AppHockeyApp/build.gradle",
                "TMessagesProj_AppHuawei/build.gradle",
                "TMessagesProj_AppStandalone/build.gradle",
                "TMessagesProj_AppTests/build.gradle"
        ].each { buildScriptPath ->
            if (!rootProject.file(buildScriptPath).text.contains(tunnelNativeTargets)) {
                throw new GradleException("${buildScriptPath} must build Telegram and both tunnel JNI targets")
            }
        }

        def tunnelCheckTask = tasks.named("tunnelCheck").get()
        def tunnelCheckDependencyPaths = tunnelCheckTask.taskDependencies.getDependencies(tunnelCheckTask)*.path as Set
        [
                ":TMessagesProj:testDebugUnitTest",
                ":TMessagesProj:testTunnelGo",
                ":TMessagesProj:verifyTunnelStaticGuards"
        ].each { path ->
            if (!tunnelCheckDependencyPaths.contains(path)) {
                throw new GradleException("tunnelCheck is missing dependency '${path}'")
            }
        }

        def tunnelPackageTask = tasks.named("tunnelPackageDebug").get()
        def tunnelPackageDependencyPaths = tunnelPackageTask.taskDependencies.getDependencies(tunnelPackageTask)*.path as Set
        if (!tunnelPackageDependencyPaths.contains(":TMessagesProj_App:assembleAfatDebug")) {
            throw new GradleException("tunnelPackageDebug must depend on :TMessagesProj_App:assembleAfatDebug")
        }

        def appAssembleTask = project(":TMessagesProj_App").tasks.named("assembleAfatDebug").get()
        def appAssembleDependencyPaths = appAssembleTask.taskDependencies.getDependencies(appAssembleTask)*.path as Set
        if (!appAssembleDependencyPaths.contains(":tunnelCheck")) {
            throw new GradleException("assembleAfatDebug must depend on :tunnelCheck")
        }
    }
}

tasks.register("tunnelCheck") {
    description = "Runs the canonical no-emulator tunnel checks."
    group = "verification"
    dependsOn "verifyTunnelCommandContract"
    dependsOn ":TMessagesProj:testDebugUnitTest"
    dependsOn ":TMessagesProj:testTunnelGo"
    dependsOn ":TMessagesProj:verifyTunnelStaticGuards"
}

tasks.register("tunnelPackageDebug") {
    description = "Builds and verifies the canonical afat debug tunnel APK."
    group = "build"
    dependsOn ":TMessagesProj_App:assembleAfatDebug"
}

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    plugins.withId('com.android.application') {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }
}
