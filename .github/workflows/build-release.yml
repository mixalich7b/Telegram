name: tgwg release build

on:
  push:
    branches:
      - feat/wg-embed

concurrency:
  group: tgwg-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64
      - tgwg-build

    timeout-minutes: 120

    steps:
      - name: Configure GitHub authentication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH}"

      - name: Update repository
        shell: bash
        run: |
          set -euxo pipefail

          REPO_URL="https://github.com/mixalich7b/Telegram.git"
          BRANCH="feat/wg-embed"

          cd /ci/repo

          if [ ! -d "./.git" ]; then
            echo "Initial clone"
            git clone --recursive --shallow-submodules --branch "${BRANCH}" "${REPO_URL}" .
          else
            echo "Update existing repository"
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            git reset --hard "origin/${BRANCH}"
          fi
          
          git submodule init
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1 --jobs 1

          git clean -fd

      - name: Repair submodules
        shell: bash
        working-directory: /ci/repo
        run: |
          set -Eeuo pipefail
          broken=0
          check_submodules() {
              git submodule foreach --quiet --recursive '
                  failed=0

                  # Git repository должен быть валидным.
                  if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
                      echo "BROKEN_SUBMODULE:$displaypath:no-valid-HEAD"
                      failed=1
                  fi

                  # Working tree не должен быть пустым.
                  #
                  # .git у submodule обычно является файлом, поэтому
                  # исключаем его из проверки.
                  if ! find . \
                      -mindepth 1 \
                      -maxdepth 1 \
                      ! -name .git \
                      -print -quit \
                      | grep -q .
                  then
                      echo "BROKEN_SUBMODULE:$displaypath:empty-working-tree"
                      failed=1
                  fi

                  exit "$failed"
              '
          }

          if ! check_submodules; then
              broken=1
          fi

          if [ "$broken" -eq 0 ]; then
              echo "=== All submodules are healthy ==="
              exit 0
          fi

          echo "::warning::Broken submodule state detected"
          echo "=== Reinitializing all submodules ==="

          #
          # В аварийном случае лучше полностью сбросить состояние submodules,
          # чем пытаться чинить отдельный .git/modules/... вручную.
          #

          git submodule deinit --all --force || true

          # Удаляем cached git repositories submodules.
          # Это заставит Git действительно клонировать их заново.
          rm -rf .git/modules

          #
          # После deinit рабочие каталоги submodules обычно пустые,
          # но Git может оставить файлы/каталоги после неудачного checkout.
          # Удаляем именно пути, перечисленные в .gitmodules.
          #
          while IFS= read -r path; do
              [ -n "$path" ] || continue

              echo "Removing stale submodule working tree: $path"
              rm -rf -- "$path"
          done < <(
              git config \
                  --file .gitmodules \
                  --get-regexp '^submodule\..*\.path$' \
              | sed 's/^[^ ]* //'
          )

          echo "=== Sync submodule configuration after reset ==="
          git submodule sync --recursive

          echo "=== Fresh submodule checkout ==="

          git submodule update \
              --init \
              --recursive \
              --force \
              --jobs 1

          echo "=== Verify repaired submodules ==="

          if ! check_submodules; then
              echo "::error::Submodule repair failed"
              exit 1
          fi

          echo "=== Submodules repaired successfully ==="

      - name: Copy firebase config
        shell: bash
        run: |
          set -euxo pipefail

          cp --remove-destination /ci/firebase/google-services.json \
             /ci/repo/TMessagesProj/google-services.json
          cp --remove-destination /ci/firebase/google-services.json \
             /ci/repo/TMessagesProj_App/google-services.json

      - name: Build release
        shell: bash
        run: |
          set -euxo pipefail

          cd /ci/repo

          ./gradlew clean --no-daemon :TMessagesProj_App:assembleAfatRelease

      - name: Publish APK
        shell: bash
        run: |
          set -euxo pipefail

          cd /ci/repo

          SHORT_COMMIT="$(git rev-parse --short=10 HEAD)"
          TIMESTAMP="$(date '+%Y-%m-%d_%H-%M-%S')"
          APK="$(find TMessagesProj_App/build/outputs/apk/afat/release -type f -name '*.apk' | head -1)"

          test -n "${APK}"

          cp -f "${APK}" "/ci/output/history/tgwg-${TIMESTAMP}-${SHORT_COMMIT}.apk"
          cp -f "${APK}" /ci/output/latest/tgwg.tmp
          mv -f /ci/output/latest/tgwg.tmp /ci/output/latest/tgwg.apk

      - name: Remove GitHub authentication
        if: always()
        shell: bash
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
